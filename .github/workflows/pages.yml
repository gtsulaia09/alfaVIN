# Static demo on GitHub Pages: https://gtsulaia09.github.io/alfaVIN/
# Publishes public/ as is. Pages has no server, so public/demo.js switches the page to a sample report
# (live decoding needs the Worker in src/index.js). One-time setup: Settings → Pages → Source: GitHub Actions.
name: Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
